<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>

<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const tabs = [
  { id: "bigpicture", label: "🏭 큰 그림" },
  { id: "experiment", label: "🔬 실험 플로우" },
  { id: "daily", label: "📅 일일 운영" },
  { id: "agents", label: "🤖 에이전트 구조" },
  { id: "db", label: "💾 DB 설계" },
];

const C = {
  bg: "#0a0a0f", card: "#12121a", cardHover: "#1a1a25",
  border: "#1e1e2e", borderAccent: "#2a2a3e",
  text: "#e2e2e8", textDim: "#8888a0", textMuted: "#5a5a72",
  accent: "#6366f1", accentDim: "#4f46e5",
  green: "#22c55e", greenDim: "#16a34a", orange: "#f59e0b",
  red: "#ef4444", cyan: "#06b6d4", purple: "#a855f7",
  pink: "#ec4899", blue: "#3b82f6",
};

const Badge = ({ color, children }) => (
  <span style={{ background: color + "20", color, padding: "2px 8px", borderRadius: 4, fontSize: 11, fontWeight: 600, letterSpacing: 0.3, whiteSpace: "nowrap" }}>
    {children}
  </span>
);

const Card = ({ title, children, accent = C.accent, style = {} }) => (
  <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 12, padding: 20, borderTop: `3px solid ${accent}`, ...style }}>
    {title && <div style={{ fontSize: 14, fontWeight: 700, color: accent, marginBottom: 12, letterSpacing: 0.5 }}>{title}</div>}
    {children}
  </div>
);

const Arrow = ({ direction = "down", color = C.textMuted, label }) => (
  <div style={{ display: "flex", flexDirection: "column", alignItems: "center", padding: "6px 0" }}>
    {label && <span style={{ fontSize: 10, color: C.textDim, marginBottom: 2 }}>{label}</span>}
    <span style={{ color, fontSize: 18 }}>{direction === "down" ? "↓" : direction === "right" ? "→" : "↑"}</span>
  </div>
);

const FlowStep = ({ emoji, title, sub, accent = C.accent, active }) => (
  <div style={{ background: active ? accent + "15" : C.card, border: `1px solid ${active ? accent : C.border}`, borderRadius: 10, padding: "12px 16px", textAlign: "center", minWidth: 120 }}>
    <div style={{ fontSize: 20, marginBottom: 4 }}>{emoji}</div>
    <div style={{ fontSize: 12, fontWeight: 700, color: C.text }}>{title}</div>
    {sub && <div style={{ fontSize: 10, color: C.textDim, marginTop: 2 }}>{sub}</div>}
  </div>
);

// ═══════════════════════════════════════
// TAB 1: BIG PICTURE
// ═══════════════════════════════════════
const BigPicture = () => (
  <div style={{ display: "flex", flexDirection: "column", gap: 24 }}>

        <Card title="🎯 가설 포트폴리오" accent={C.orange}>

        </Card>
        <Card title="🧠 판단 메모리" accent={C.purple}>

        <div style={{ background: C.orange + "10", border: `1px solid ${C.orange}40`, borderRadius: 10, padding: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span style={{ fontSize: 13, fontWeight: 700, color: C.text }}>Product A</span>
            <Badge color={C.orange}>검증 중</Badge>
          </div>
          <div style={{ fontSize: 10, color: C.textDim, marginTop: 8, lineHeight: 1.5 }}>

        ["다음 액션", "Text", "이 판단으로 인한 후속", "UX 개선 실험 카드 생성"],
        ["학습점", "Text", "노하우가 될 만한 것", "결제 플로우는 3단계 이하여야 함"],
      ]} />

      {/* Relations */}
      <Card title="DB 간 관계" accent={C.textDim}>
        <div style={{ textAlign: "center", padding: "12px 0", fontSize: 13, color: C.textDim, lineHeight: 2.2 }}>
          <span style={{ color: C.blue, fontWeight: 700 }}>실험 보드</span> ←― 1:N ―→ <span style={{ color: C.green, fontWeight: 700 }}>태스크 보드</span><br />
          <span style={{ color: C.blue, fontWeight: 700 }}>실험 보드</span> ←― 1:N ―→ <span style={{ color: C.purple, fontWeight: 700 }}>판단 메모리</span><br />
          <span style={{ fontSize: 11, color: C.textMuted }}>하나의 실험에 여러 태스크, 여러 판단 이력이 연결됨. 이 관계를 통해 AI가 패턴을 읽는다.</span>
        </div>
      </Card>

      {/* Who reads what */}
      <Card title="누가 어떤 DB를 읽는가" accent={C.accent}>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 10 }}>
          {[
            { mode: "🎯 전략 모드", reads: "판단 메모리 (패턴 분석)", writes: "실험 보드 (카드 생성)", color: C.orange },
            { mode: "🔨 분해 모드", reads: "실험 보드 (Go된 카드)", writes: "태스크 보드 (태스크 생성)", color: C.blue },
            { mode: "📋 운영 모드", reads: "태스크 보드 (오늘 할 일)", writes: "태스크 상태 (업데이트)", color: C.cyan },
            { mode: "📚 지식 모드", reads: "판단 메모리 + 외부", writes: "콘텐츠 + 노하우", color: C.green },
            { mode: "🔄 메타 모드", reads: "전체 DB", writes: "시스템 개선 제안", color: C.pink },
          ].map((m, i) => (
            <div key={i} style={{ background: C.bg, borderRadius: 8, padding: 10 }}>
              <div style={{ fontSize: 11, fontWeight: 600, color: m.color }}>{m.mode}</div>
              <div style={{ fontSize: 10, color: C.textDim, marginTop: 4 }}>읽기: {m.reads}</div>
              <div style={{ fontSize: 10, color: C.textDim }}>쓰기: {m.writes}</div>
            </div>
          ))}
        </div>
      </Card>
    </div>
  );
};

// ═══════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════
function App() {
  const [activeTab, setActiveTab] = useState("bigpicture");

  const renderTab = () => {
    switch (activeTab) {
      case "bigpicture": return <BigPicture />;
      case "experiment": return <ExperimentFlow />;
      case "daily": return <DailyOps />;
      case "agents": return <AgentArch />;
      case "db": return <DBDesign />;
      default: return <BigPicture />;
    }
  };

  return (
    <div style={{ background: C.bg, color: C.text, minHeight: "100vh", fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif', padding: "24px 16px", maxWidth: 900, margin: "0 auto" }}>
      <div style={{ textAlign: "center", marginBottom: 24 }}>
        <div style={{ fontSize: 10, color: C.textMuted, letterSpacing: 3 }}>AI-NATIVE OPERATING SYSTEM v0.1</div>
        <div style={{ fontSize: 20, fontWeight: 800, color: C.text, marginTop: 6 }}>AI 시대의 포드식 공법</div>
        <div style={{ fontSize: 12, color: C.textDim, marginTop: 4 }}>효율화가 아니라 재설계. 일하는 방식 자체가 바뀌어야 한다.</div>
      </div>

      <div style={{ display: "flex", gap: 4, marginBottom: 24, background: C.card, borderRadius: 10, padding: 4, border: `1px solid ${C.border}`, overflowX: "auto" }}>
        {tabs.map(tab => (
          <button key={tab.id} onClick={() => setActiveTab(tab.id)} style={{ flex: 1, padding: "10px 8px", borderRadius: 8, border: "none", cursor: "pointer", fontSize: 12, fontWeight: 600, transition: "all 0.2s", background: activeTab === tab.id ? C.accent : "transparent", color: activeTab === tab.id ? "#fff" : C.textDim, whiteSpace: "nowrap", minWidth: "fit-content" }}>
            {tab.label}
          </button>
        ))}
      </div>

      {renderTab()}

      <div style={{ textAlign: "center", marginTop: 32, padding: 16, borderTop: `1px solid ${C.border}`, fontSize: 10, color: C.textMuted }}>
        불완전해도 좋다. 스스로 개선할 수 있는 시스템이면 된다. — Start from Week 1.
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
